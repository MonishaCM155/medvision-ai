name: MedVision AI CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 black
        pip install -r backend/requirements.txt

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: "20"

    - name: Install Node Dependencies & Lint
      run: |
        npm install
        npm run lint

    - name: Run Build Test
      run: |
        npm run build

    - name: Run Python API Tests (FastAPI engine + checkpoint integration)
      run: |
        python -m pytest tests/ -q

    - name: Run End-to-End Engine Smoke Test
      run: |
        MEDVISION_SKIP_PRETRAINED=1 python tests/e2e_smoke.py

