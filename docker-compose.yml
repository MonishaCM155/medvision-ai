version: '3.8'

services:
  medvision-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTORCH_ENGINE_URL=${PYTORCH_ENGINE_URL:-http://127.0.0.1:8000}
      - MEDVISION_TEMPERATURE=${MEDVISION_TEMPERATURE:-1.0}
      - MEDVISION_API_RATE_LIMIT=${MEDVISION_API_RATE_LIMIT:-60}
      - QUALITY_THRESHOLD=${QUALITY_THRESHOLD:-55}
      - DATABASE_URL=postgres://medvision:${POSTGRES_PASSWORD:-medvision}@db:5432/medvision
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Optional durable store. The app falls back to JSON-file persistence when
  # this service or `pg` (npm) is unavailable, so it is safe to run without.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=medvision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medvision}
      - POSTGRES_DB=medvision
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvision -d medvision"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  pgdata:
